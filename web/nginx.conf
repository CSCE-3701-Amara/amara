server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 512;

  # Immutable content-hashed build assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API traffic: same-origin proxy to the backend, so the browser needs no
  # cross-origin credentials and CORS stays configured for direct dev access.
  location /v1/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://api:8080/health;
  }

  # SPA fallback: index.html for client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
