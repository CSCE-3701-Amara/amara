openapi: 3.1.0
info:
  title: AMARA API
  version: 0.1.0
  description: AMARA HTTP API specification following RFC 9457 Problem Details for HTTP errors.
paths:
  /health:
    get:
      summary: Liveness health check
      operationId: getHealth
      tags:
        - Health
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/jobs:
    get:
      summary: List postings owned by the authenticated company
      operationId: listCompanyJobPostings
      tags: [Jobs]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Company postings, including drafts and archived postings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPostingList'
        '401':
          $ref: '#/components/responses/PostingError'
        '403':
          $ref: '#/components/responses/PostingError'
        '500':
          $ref: '#/components/responses/PostingError'
    post:
      summary: Create a job posting as a draft
      operationId: createJobPosting
      tags: [Jobs]
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPostingRequest'
      responses:
        '201':
          description: Draft posting created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPosting'
        '400':
          $ref: '#/components/responses/PostingError'
        '401':
          $ref: '#/components/responses/PostingError'
        '403':
          $ref: '#/components/responses/PostingError'
        '500':
          $ref: '#/components/responses/PostingError'

  /v1/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID of the job posting
        schema:
          type: string
          format: uuid
    get:
      summary: Get a company-owned job posting
      operationId: getCompanyJobPosting
      tags: [Jobs]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Job posting details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPosting'
        '400':
          $ref: '#/components/responses/PostingError'
        '401':
          $ref: '#/components/responses/PostingError'
        '403':
          $ref: '#/components/responses/PostingError'
        '404':
          $ref: '#/components/responses/PostingError'
        '500':
          $ref: '#/components/responses/PostingError'
    put:
      summary: Replace a job posting's details
      description: Replaces all editable fields; omitted nullable fields are cleared.
      operationId: updateCompanyJobPosting
      tags: [Jobs]
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPostingRequest'
      responses:
        '200':
          description: Updated job posting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPosting'
        '400':
          $ref: '#/components/responses/PostingError'
        '401':
          $ref: '#/components/responses/PostingError'
        '403':
          $ref: '#/components/responses/PostingError'
        '404':
          $ref: '#/components/responses/PostingError'
        '500':
          $ref: '#/components/responses/PostingError'
    delete:
      summary: Soft-delete a company-owned posting; system admins may delete any posting
      operationId: deleteCompanyJobPosting
      tags: [Jobs]
      security:
        - SessionCookie: []
      responses:
        '204':
          description: Posting marked as deleted; no response body
        '400':
          $ref: '#/components/responses/PostingError'
        '401':
          $ref: '#/components/responses/PostingError'
        '403':
          $ref: '#/components/responses/PostingError'
        '404':
          $ref: '#/components/responses/PostingError'
        '500':
          $ref: '#/components/responses/PostingError'

  /v1/jobs/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/JobPostingId'
    post:
      summary: Publish a draft job posting
      operationId: publishJobPosting
      tags: [Jobs]
      security:
        - SessionCookie: []
      responses:
        '400':
          $ref: '#/components/responses/PostingError'
        '200':
          description: Published posting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPosting'
        '401':
          $ref: '#/components/responses/PostingError'
        '403':
          $ref: '#/components/responses/PostingError'
        '404':
          $ref: '#/components/responses/PostingError'
        '409':
          $ref: '#/components/responses/PostingError'
        '500':
          $ref: '#/components/responses/PostingError'

  /v1/jobs/{id}/republish:
    parameters:
      - $ref: '#/components/parameters/JobPostingId'
    post:
      summary: Republish an archived job posting
      operationId: republishJobPosting
      tags: [Jobs]
      security:
        - SessionCookie: []
      responses:
        '400':
          $ref: '#/components/responses/PostingError'
        '200':
          description: Republished posting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPosting'
        '401':
          $ref: '#/components/responses/PostingError'
        '403':
          $ref: '#/components/responses/PostingError'
        '404':
          $ref: '#/components/responses/PostingError'
        '409':
          $ref: '#/components/responses/PostingError'
        '500':
          $ref: '#/components/responses/PostingError'

  /v1/jobs/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/JobPostingId'
    post:
      summary: Archive a published job posting
      operationId: archiveJobPosting
      tags: [Jobs]
      security:
        - SessionCookie: []
      responses:
        '400':
          $ref: '#/components/responses/PostingError'
        '200':
          description: Archived posting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPosting'
        '401':
          $ref: '#/components/responses/PostingError'
        '403':
          $ref: '#/components/responses/PostingError'
        '404':
          $ref: '#/components/responses/PostingError'
        '409':
          $ref: '#/components/responses/PostingError'
        '500':
          $ref: '#/components/responses/PostingError'

  /api/v1/auth/registrations:
    post:
      summary: Register a candidate or interviewer
      operationId: registerCandidateOrInterviewer
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '201':
          description: Account registration accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/company-registrations:
    post:
      summary: Submit a company registration request
      operationId: registerCompany
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyRegistrationRequest'
      responses:
        '201':
          description: Company registration request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/sessions:
    post:
      summary: Create an authenticated session
      operationId: createSession
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session created
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/candidates/me:
    patch:
      summary: Modify the authenticated candidate profile
      operationId: updateCandidateProfile
      tags:
        - Auth
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateProfileUpdateRequest'
      responses:
        '200':
          description: Candidate profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/account-actions:
    post:
      summary: Deactivate or delete the authenticated candidate profile
      operationId: performAccountAction
      tags:
        - Auth
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountActionRequest'
      responses:
        '204':
          description: Account action completed and the session was terminated
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedSessionCookie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/sessions/current:
    delete:
      summary: Terminate the current authenticated session
      operationId: deleteCurrentSession
      tags:
        - Auth
      security:
        - SessionCookie: []
      responses:
        '204':
          description: Session terminated
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedSessionCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    JobPostingId:
      name: id
      in: path
      required: true
      description: UUID of the job posting
      schema:
        type: string
        format: uuid
  schemas:
    UserRegistrationRequest:
      oneOf:
        - $ref: '#/components/schemas/CandidateRegistrationRequest'
        - $ref: '#/components/schemas/InterviewerRegistrationRequest'
      discriminator:
        propertyName: accountType

    CandidateRegistrationRequest:
      type: object
      additionalProperties: false
      required:
        - accountType
        - email
        - password
        - firstName
        - lastName
      properties:
        accountType:
          const: candidate
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100

    InterviewerRegistrationRequest:
      type: object
      additionalProperties: false
      required:
        - accountType
        - email
        - password
        - firstName
        - lastName
        - companySecret
      properties:
        accountType:
          const: interviewer
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        companySecret:
          type: string

    CompanyRegistrationRequest:
      type: object
      additionalProperties: false
      required:
        - companyName
        - registrationNumber
        - email
        - password
      properties:
        companyName:
          type: string
          minLength: 1
          maxLength: 200
        registrationNumber:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8

    RegistrationResponse:
      type: object
      required:
        - id
        - accountType
        - email
        - status
        - createdAt
      properties:
        id:
          type: string
        accountType:
          type: string
          enum:
            - candidate
            - interviewer
            - company
        email:
          type: string
          format: email
        status:
          type: string
          enum:
            - pending_verification
            - pending_review
            - active
        createdAt:
          type: string
          format: date-time

    JobPostingRequest:
      type: object
      additionalProperties: false
      required: [title, seniority_level, employment_type, amarat]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: [string, 'null']
        language:
          type: [string, 'null']
        currency:
          type: [string, 'null']
        seniority_level:
          type: string
          minLength: 1
        employment_type:
          type: string
          enum:
            - "on-site full-time"
            - "on-site part-time"
            - "remote full-time"
            - "remote part-time"
        location:
          type: [string, 'null']
        salary_min:
          type: [integer, 'null']
          format: int32
          minimum: 0
        salary_max:
          type: [integer, 'null']
          format: int32
          minimum: 0
        salary_visible:
          type: [boolean, 'null']
        open_positions:
          type: [integer, 'null']
          format: int32
          minimum: 1
        application_opening:
          type: [string, 'null']
          format: date-time
        application_deadline:
          type: [string, 'null']
          format: date-time
        max_applications:
          type: [integer, 'null']
          format: int32
          minimum: 1
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/JobPostingRequirementInput'
        amarat:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/JobPostingAmaraInput'

    JobPostingRequirementInput:
      type: object
      additionalProperties: false
      required: [text, requirement_type]
      properties:
        text:
          type: string
          minLength: 1
        requirement_type:
          type: string
          enum: [must_have, nice_to_have]

    JobPostingAmaraInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: [string, 'null']

    JobPosting:
      type: object
      required: [id, company_id, title, seniority_level, employment_type, status, created_at, updated_at, requirements, amarat]
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, 'null']
        language:
          type: [string, 'null']
        currency:
          type: [string, 'null']
        seniority_level:
          type: string
        employment_type:
          type: string
          enum:
            - "on-site full-time"
            - "on-site part-time"
            - "remote full-time"
            - "remote part-time"
        location:
          type: [string, 'null']
        salary_min:
          type: [integer, 'null']
          format: int32
        salary_max:
          type: [integer, 'null']
          format: int32
        salary_visible:
          type: [boolean, 'null']
        open_positions:
          type: [integer, 'null']
          format: int32
        application_opening:
          type: [string, 'null']
          format: date-time
        application_deadline:
          type: [string, 'null']
          format: date-time
        max_applications:
          type: [integer, 'null']
          format: int32
        status:
          type: string
          enum: [draft, published, archived]
        last_autosaved_at:
          type: [string, 'null']
          format: date-time
        published_at:
          type: [string, 'null']
          format: date-time
        archived_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/JobPostingRequirement'
        amarat:
          type: array
          items:
            $ref: '#/components/schemas/JobPostingAmara'

    JobPostingRequirement:
      type: object
      required: [id, text, requirement_type]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        requirement_type:
          type: string
          enum: [must_have, nice_to_have]

    JobPostingAmara:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, 'null']

    JobPostingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobPosting'

    PostingErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        mfaCode:
          type: string
          minLength: 1
          maxLength: 10

    LoginResponse:
      type: object
      required:
        - user
        - session
      properties:
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
        session:
          $ref: '#/components/schemas/Session'

    AuthenticatedUser:
      type: object
      required:
        - id
        - email
        - role
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - candidate
            - interviewer
            - company_representative

    Session:
      type: object
      required:
        - expiresAt
      properties:
        expiresAt:
          type: string
          format: date-time

    CandidateProfileFields:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        phoneNumber:
          type: string
          maxLength: 50
        githubProfile:
          type: string
          format: uri
        linkedinProfile:
          type: string
          format: uri
        portfolioLink:
          type: string
          format: uri
        gender:
          type: string
          maxLength: 50
        birthDate:
          type: string
          format: date
        nationality:
          type: string
          maxLength: 100
        address:
          type: string
          maxLength: 500
        biography:
          type: string
          maxLength: 5000
        yearsOfExperience:
          type: integer
          minimum: 0
        available:
          type: boolean

    CandidateProfileUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/CandidateProfileFields'
      unevaluatedProperties: false

    CandidateProfile:
      allOf:
        - $ref: '#/components/schemas/CandidateProfileFields'
        - type: object
          required:
            - id
            - name
            - email
            - createdAt
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
      unevaluatedProperties: false

    AccountActionRequest:
      type: object
      additionalProperties: false
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - deactivate
            - delete

    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: The request field that caused the error.
          example: title
        message:
          type: string
          description: Safe, human-readable error description for this field.
          example: Title is required.

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: A URI reference identifying the problem type.
          default: about:blank
          example: about:blank
        title:
          type: string
          description: Short, human-readable summary of the problem type.
          example: Not Found
        status:
          type: integer
          description: The HTTP status code generated by the origin server.
          example: 404
        detail:
          type: string
          description: Safe human-readable explanation specific to this occurrence of the problem.
          example: The requested resource was not found.
        instance:
          type: string
          description: Request path identifying the occurrence of the problem.
          example: /api/v1/jobs/job_123
        code:
          type: string
          description: Stable machine-readable code for programmatic error handling.
          example: not_found
        errors:
          type: array
          description: List of field-level validation errors, present when status is 422.
          items:
            $ref: '#/components/schemas/FieldError'

  headers:
    SessionCookie:
      description: HttpOnly session cookie established by the server.
      schema:
        type: string
    ClearedSessionCookie:
      description: Expired session cookie clearing the authenticated session.
      schema:
        type: string

  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: amara_session

  responses:
    PostingError:
      description: Posting management error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PostingErrorResponse'
    BadRequest:
      description: Bad Request (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Unauthorized (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Forbidden (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Not Found (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    MethodNotAllowed:
      description: Method Not Allowed (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflict (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableContent:
      description: Unprocessable Content (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: Too Many Requests (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: Internal Server Error (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: Service Unavailable (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
