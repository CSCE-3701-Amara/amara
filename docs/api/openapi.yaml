          type: string
          format: uuid
        stageId:
          type: string
          format: uuid
        status:
          type: string
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
        deadline:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - id
        - applicationId
        - stageId
        - status

    CandidateQuestion:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        prompt:
          type: string
        responseFormat:
          type: string
          enum:
            - multiple_choice
            - short_text
            - long_text
            - code
            - video
        options:
          type:
            - array
            - 'null'
          items:
            type: string
        position:
          type: integer
          minimum: 0
      required:
        - id
        - prompt
        - responseFormat
        - position
      description: Delivery-only question. Never includes answer keys, private coding test cases, rubrics, grader
        identifiers, or authoring configuration.

    CandidateAnswer:
      type: object
      additionalProperties: false
      properties:
        response:
          oneOf:
            - type: string
            - type: array
              items:
                type: integer
                minimum: 0
              uniqueItems: true
            - type: object
              additionalProperties: false
              properties:
                language:
                  type: string
                  minLength: 1
                code:
                  type: string
              required:
                - language
                - code
            - type: object
              additionalProperties: false
              properties:
                videoUrl:
                  type: string
                  format: uri
              required:
                - videoUrl
            - type: 'null'
          description: Text for written answers; option-index array for multiple choice; language/code for coding;
            authorized uploaded video reference for video. Null clears an unsubmitted draft. Match the assigned
            question response format.
      required:
        - response

    CandidateSubmission:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        attemptId:
          type: string
          format: uuid
        questionId:
          type: string
          format: uuid
        response:
          oneOf:
            - type: string
            - type: array
              items:
                type: integer
                minimum: 0
              uniqueItems: true
            - type: object
              additionalProperties: false
              properties:
                language:
                  type: string
                  minLength: 1
                code:
                  type: string
              required:
                - language
                - code
            - type: object
              additionalProperties: false
              properties:
                videoUrl:
                  type: string
                  format: uri
              required:
                - videoUrl
            - type: 'null'
          description: Text for written answers; option-index array for multiple choice; language/code for coding;
            authorized uploaded video reference for video. Null clears an unsubmitted draft. Match the assigned
            question response format.
        savedAt:
          type: string
          format: date-time
      required:
        - id
        - attemptId
        - questionId
        - savedAt

    AssessmentAttempt:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        instanceId:
          type: string
          format: uuid
        stageExecutionId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - available
            - in_progress
            - submitted
            - pending_grading
            - scored
            - missed
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
        deadline:
          type: string
          format: date-time
        submittedAt:
          type:
            - string
            - 'null'
          format: date-time
        autoSubmitted:
          type: boolean
        questions:
          type: array
          items:
            $ref: '#/components/schemas/CandidateQuestion'
      required:
        - id
        - instanceId
        - stageExecutionId
        - status
        - deadline
        - autoSubmitted
        - questions
      description: Candidate delivery projection. Configuration snapshots and selected_content are converted into
        safe question DTOs, never serialized as raw JSON. The effective deadline incorporates the active limit,
        stage end, completion window and permitted extensions.

    AssessmentExtensionRequest:
      type: object
      additionalProperties: false
      properties:
        additionalActiveSeconds:
          type: integer
          minimum: 1
        newDeadline:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
      anyOf:
        - required:
            - additionalActiveSeconds
        - required:
            - newDeadline
      required:
        - reason
      description: At least one timing change is required. Only a started, unsubmitted assessment may be extended;
        newDeadline must move forward. Record actor, old/new timing and reason.

    AssessmentResult:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        instanceId:
          type: string
          format: uuid
        attemptId:
          type:
            - string
            - 'null'
          format: uuid
        passed:
          type: boolean
        score:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 100
        earnedPoints:
          type:
            - number
            - 'null'
          minimum: 0
        maxPoints:
          type:
            - number
            - 'null'
          exclusiveMinimum: 0
        feedback:
          type:
            - string
            - 'null'
        feedbackIsAiGenerated:
          type: boolean
        disclosedAt:
          type: string
          format: date-time
        scoredAt:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - id
        - instanceId
        - passed
        - feedbackIsAiGenerated
        - disclosedAt
      description: Candidate result available only after explicit disclosure. Never includes private grading evidence
        or unreleased feedback. Pending grading has no final result.

    ManagedAssessmentResult:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        instanceId:
          type: string
          format: uuid
        attemptId:
          type:
            - string
            - 'null'
          format: uuid
        passed:
          type: boolean
        score:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 100
        earnedPoints:
          type:
            - number
            - 'null'
          minimum: 0
        maxPoints:
          type:
            - number
            - 'null'
          exclusiveMinimum: 0
        feedback:
          type:
            - string
            - 'null'
        feedbackIsAiGenerated:
          type: boolean
        disclosedAt:
          type:
            - string
            - 'null'
          format: date-time
        scoredAt:
          type:
            - string
            - 'null'
          format: date-time
        isDisclosed:
          type: boolean
        feedbackApprovedAt:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - id
        - instanceId
        - passed
        - feedbackIsAiGenerated
        - isDisclosed
      description: Hiring Manager projection for reviewing a completed score and approving feedback before disclosure.
        Never exposed to candidates while undisclosed.

    AssessmentVideoUpload:
      type: object
      additionalProperties: false
      properties:
        videoUrl:
          type: string
          format: uri
      required:
        - videoUrl
      description: Authorized storage reference usable only in a video answer for this attempt; uploading does
        not submit an answer.

    GradingSubmission:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        attemptId:
          type: string
          format: uuid
        questionId:
          type: string
          format: uuid
        anonymousIdentifier:
          type: string
          format: uuid
        prompt:
          type: string
        response:
          oneOf:
            - type: string
            - type: array
              items:
                type: integer
                minimum: 0
              uniqueItems: true
            - type: object
              additionalProperties: false
              properties:
                language:
                  type: string
                  minLength: 1
                code:
                  type: string
              required:
                - language
                - code
            - type: object
              additionalProperties: false
              properties:
                videoUrl:
                  type: string
                  format: uri
              required:
                - videoUrl
            - type: 'null'
          description: Text for written answers; option-index array for multiple choice; language/code for coding;
            authorized uploaded video reference for video. Null clears an unsubmitted draft. Match the assigned
            question response format.
        maxPoints:
          type: number
          exclusiveMinimum: 0
        earnedPoints:
          type:
            - number
            - 'null'
          minimum: 0
        gradingStatus:
          type: string
          enum:
            - pending
            - evaluation_pending
            - graded
        gradedAt:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - id
        - attemptId
        - questionId
        - anonymousIdentifier
        - prompt
        - maxPoints
        - gradingStatus
      description: Assigned-grader projection. Enforce anonymity and do not expose unassigned submissions. Grading
        does not grant authority to pass or reject a candidate.

    GradingSubmissionPage:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GradingSubmission'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - data
        - pagination

