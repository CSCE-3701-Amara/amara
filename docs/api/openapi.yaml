          format: date-time
        endAt:
          type: string
          format: date-time
      required:
        - startAt
        - endAt
      description: End must follow start. Use RFC 3339 timestamps with offsets; the API emits UTC and clients localize
        presentation.

    Interview:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        stageExecutionId:
          type: string
          format: uuid
        scheduledStartAt:
          type: string
          format: date-time
        scheduledEndAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - pending_confirmation
            - confirmed
            - completed
            - cancelled
        outcome:
          type:
            - string
            - 'null'
          enum:
            - held
            - candidate_absent
            - interviewer_absent
            - null
        provider:
          type:
            - string
            - 'null'
        joinUrl:
          type:
            - string
            - 'null'
          format: uri
        rescheduleCount:
          type: integer
          minimum: 0
          maximum: 2
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - id
        - stageExecutionId
        - scheduledStartAt
        - scheduledEndAt
        - status
        - rescheduleCount
        - createdAt
