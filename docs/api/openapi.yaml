openapi: 3.1.0
info:
  title: AMARA API
  version: 0.1.0
  description: |
    AMARA HTTP API specification following RFC 9457 Problem Details for HTTP errors,
    except where an implemented operation documents its existing JSON error shape.
    New endpoints use the canonical /v1 prefix. Existing AUTH and candidate-profile
    contract paths under /api/v1 are retained at their documented URLs.
    On main, registered module routes also have /api/v1 compatibility aliases;
    login additionally accepts /v1/auth/login and /api/v1/auth/login. Clients should
    use the exact operation paths below rather than substituting prefixes.
    Operations marked x-implementation-status: planned describe intended behavior;
    their handlers are not registered and requests currently return router 404s.
tags:
  - name: Health
    description: Service liveness.
  - name: Auth
    description: Registration, sessions and account lifecycle.
  - name: Companies
    description: Public and authenticated company profiles.
  - name: Interviewers
    description: Authenticated interviewer profiles.
  - name: Jobs
    description: Posting management, publication and application admission.
  - name: Modules
    description: Reusable assessment modules and question authoring.
  - name: Pipelines
    description: Workflow design, draft versions, validation and publication.
  - name: Applications
    description: Application history, screening, progress and finalists.
  - name: Pipeline execution
    description: Runtime stages, dashboards, comparisons and advancement decisions.
  - name: Assessments
    description: Assessment delivery, saved answers, timing and candidate results.
  - name: Grading
    description: Assigned human grading and hiring-team result review.
  - name: Interviews
    description: Scheduling, assignments, private notes and scorecards.
  - name: Feedback
    description: Feedback authoring, approval, release and result disclosure.
  - name: Offers
    description: Offer creation, candidate responses and deadlines.
  - name: Administration
    description: Company registration review and account administration.

# Established paths and payloads take precedence over newer additions.
# New endpoints use /v1; retained /api/v1 paths and compatibility aliases are described above.
paths:

  # Health
  /health:
    get:
      summary: Liveness health check
      operationId: getHealth
      tags:
        - Health
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'


  # Authentication and account lifecycle
  /api/v1/auth/registrations:
    post:
      summary: Register a candidate or interviewer
      operationId: registerCandidateOrInterviewer
      description: Planned operation; no registration handler is currently registered.
      x-implementation-status: planned
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '201':
          description: Account registration accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/company-registrations:
    post:
      summary: Submit a company registration request
      operationId: registerCompany
      description: Planned operation; no company registration handler is currently registered.
      x-implementation-status: planned
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyRegistrationRequest'
      responses:
        '201':
          description: Company registration request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/sessions:
    post:
      summary: Create an authenticated session
      operationId: createSession
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session created
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/sessions/current:
    delete:
      summary: Terminate the current authenticated session
      operationId: deleteCurrentSession
      description: Planned operation; no logout handler is currently registered. The 204 response and clearing cookie describe intended behavior.
      x-implementation-status: planned
      tags:
        - Auth
      security:
        - SessionCookie: []
      responses:
        '204':
          description: Session terminated
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedSessionCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/account-actions:
    post:
      summary: Deactivate or delete the authenticated candidate profile
      operationId: performAccountAction
      description: Planned operation; no account-action handler is currently registered.
      x-implementation-status: planned
      tags:
        - Auth
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountActionRequest'
      responses:
        '204':
          description: Account action completed and the session was terminated
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedSessionCookie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'


  # Candidate profile and application history
  /api/v1/candidates/me:
    patch:
      summary: Modify the authenticated candidate profile
      operationId: updateCandidateProfile
      description: Planned operation; no candidate-profile update handler is currently registered.
      x-implementation-status: planned
      tags:
        - Auth
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateProfileUpdateRequest'
      responses:
        '200':
          description: Candidate profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/candidates/me/applications:
    get:
      summary: List candidate application history
      operationId: listOwnApplications
      tags:
        - Applications
      description: Authenticated candidate only; records must belong to that candidate. Derive identity from
        the session. Results are ordered by submission time (falling back to creation time), newest first.
      x-implementation-status: implemented
      x-erd-entities:
        - APPLICATIONS
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          required: false
          description: Filter by workflow status.
          schema:
            type: string
      responses:
        '200':
          description: List candidate application history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'


  # Company and interviewer profiles
  /v1/companies/me:
    get:
      summary: Get the authenticated company profile
      operationId: getOwnCompanyProfile
      tags:
        - Companies
      description: Owning-company Hiring Manager or authorized system administrator only; validate ownership
        through the resource relationship chain.
      x-implementation-status: planned
      x-erd-entities:
        - COMPANIES
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Get the authenticated company profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Update the authenticated company profile
      operationId: updateOwnCompanyProfile
      tags:
        - Companies
      description: Owning-company Hiring Manager or authorized system administrator only; validate ownership
        through the resource relationship chain. Omitted properties are unchanged; explicit null clears only
        nullable properties. Unknown and read-only fields are rejected. Approval and credentials are not editable
        here.
      x-implementation-status: planned
      x-erd-entities:
        - COMPANIES
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyProfileUpdate'
            example:
              displayName: Example Engineering
              websiteLink: https://example.com
      responses:
        '200':
          description: Update the authenticated company profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/companies/me/interviewers:
    get:
      summary: List interviewers associated with the company
      operationId: listCompanyInterviewers
      tags:
        - Companies
      description: Owning-company Hiring Manager or authorized system administrator only; validate ownership
        through the resource relationship chain.
      x-implementation-status: planned
      x-erd-entities:
        - INTERVIEWERS
        - COMPANIES
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List interviewers associated with the company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/companies/{companyId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      summary: Get a public company profile
      operationId: getPublicCompanyProfile
      tags:
        - Companies
      description: Expose only approved, active, unbanned companies and public contact information. Return 404
        for private or unavailable companies.
      x-implementation-status: planned
      x-erd-entities:
        - COMPANIES
      security: []
      responses:
        '200':
          description: Get a public company profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/interviewers/me:
    get:
      summary: Get the authenticated interviewer profile
      operationId: getOwnInterviewerProfile
      tags:
        - Interviewers
      description: Only the authenticated interviewer may access their own profile.
      x-implementation-status: planned
      x-erd-entities:
        - INTERVIEWERS
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Get the authenticated interviewer profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewerProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Update the authenticated interviewer name
      operationId: updateOwnInterviewerProfile
      tags:
        - Interviewers
      description: Only the authenticated interviewer may update their profile. Company association, email verification,
        and account status cannot be changed through this request. Omitted properties are unchanged; explicit
        null clears only nullable properties. Unknown and read-only fields are rejected.
      x-implementation-status: planned
      x-erd-entities:
        - INTERVIEWERS
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewerProfileUpdate'
            example:
              name: Mona Hassan
      responses:
        '200':
          description: Update the authenticated interviewer name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewerProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'


  # Job postings and admission
  /v1/jobs:
    get:
      summary: List postings owned by the authenticated company
      operationId: listCompanyJobPostings
      tags: [Jobs]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Company postings, including drafts and archived postings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPostingList'
        '401':
          $ref: '#/components/responses/PostingError'
        '403':
          $ref: '#/components/responses/PostingError'
        '500':
          $ref: '#/components/responses/PostingError'
    post:
      summary: Create a job posting as a draft
      operationId: createJobPosting
      tags: [Jobs]
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPostingRequest'
      responses:
        '201':
          description: Draft posting created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPosting'
        '400':
          $ref: '#/components/responses/PostingError'
        '401':
          $ref: '#/components/responses/PostingError'
        '403':
          $ref: '#/components/responses/PostingError'
        '500':
          $ref: '#/components/responses/PostingError'

  /v1/company/{company_id}/postings:
    get:
      summary: List a company's postings
      description: Requires a company session whose authenticated company ID matches company_id. Includes draft, published, and archived postings, excluding deleted postings. Title is a case-insensitive substring filter; status is an exact match. Results are ordered by created_at descending, then ID descending. The cursor is opaque to clients and next_cursor is omitted when no further page exists.
      operationId: listCompanyPostings
      tags: [Jobs]
      security:
        - SessionCookie: []
      parameters:
        - name: company_id
          in: path
          required: true
          description: UUID of the authenticated company.
          schema:
            type: string
            format: uuid
        - name: title
          in: query
          description: Case-insensitive substring match on posting title.
          schema:
            type: string
        - name: status
          in: query
          description: Exact posting status filter.
          schema:
            type: string
            enum: [draft, published, archived]
        - name: limit
          in: query
          description: Number of postings to return. Defaults to 20 only when omitted.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Opaque cursor returned as next_cursor by the previous page.
          schema:
            type: string
      responses:
        '200':
          description: A page of postings for the authenticated company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPostingPage'
        '400':
          $ref: '#/components/responses/PostingError'
        '401':
          $ref: '#/components/responses/PostingError'
        '403':
          $ref: '#/components/responses/PostingError'
        '500':
          $ref: '#/components/responses/PostingError'

  /v1/jobs/feed:
    get:
      summary: Browse published job postings as a candidate
      operationId: getCandidateJobFeed
      tags: [Jobs]
      description: |
        Requires a valid amara_session cookie for a candidate account. Returns
        published, nondeleted postings whose application window is open, ordered
        by published_at descending, then id descending. Expired postings are
        archived before loading the feed. String filters are trimmed; blank
        strings are ignored. This existing endpoint uses cursor pagination and
        snake_case JSON fields. It returns neither a total nor an offset.
      security:
        - SessionCookie: []
      parameters:
        - name: title
          in: query
          description: Case-insensitive substring match on title (SQL ILIKE; percent and underscore retain wildcard semantics).
          schema:
            type: string
        - name: language
          in: query
          description: Exact match on posting language.
          schema:
            type: string
        - name: currency
          in: query
          description: Exact match on posting currency.
          schema:
            type: string
        - name: seniority_level
          in: query
          description: Exact match on posting seniority level.
          schema:
            type: string
        - name: employment_type
          in: query
          description: Exact match on posting employment type.
          schema:
            type: string
        - name: location
          in: query
          description: Case-insensitive substring match on location (SQL ILIKE; percent and underscore retain wildcard semantics).
          schema:
            type: string
        - name: salary_min
          in: query
          description: Keep postings whose salary_max is at least this value or is null. Negative values are accepted by the current handler.
          schema:
            type: integer
            format: int32
            minimum: -2147483648
            maximum: 2147483647
        - name: salary_max
          in: query
          description: Keep postings whose salary_min is at most this value or is null. Negative values are accepted by the current handler.
          schema:
            type: integer
            format: int32
            minimum: -2147483648
            maximum: 2147483647
        - name: limit
          in: query
          description: Page size from 1 to 100. Omitted, empty, or zero selects the default of 20; other out-of-range values return 400.
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Pass the previous page's next_cursor unchanged and URL-encoded. Empty or omitted starts the feed; malformed timestamps or UUIDs return 400.
          schema:
            type: string
          example: '2026-11-01T12:30:00.123456789Z|4ce85a22-78c1-48bb-bbf6-1b2e06f6ad17'
      responses:
        '200':
          description: Candidate job feed; items is empty when no postings match. next_cursor is omitted when there is no further page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobFeedPage'
              example:
                items:
                  - id: 4ce85a22-78c1-48bb-bbf6-1b2e06f6ad17
                    company_id: 1a1a77b2-32ed-45db-a437-7f66271e78af
                    title: Backend Engineer
                    description: Build reliable services.
                    language: en
                    currency: EGP
                    seniority_level: senior
                    employment_type: remote full-time
                    location: Cairo
                    salary_min: 40000
                    salary_max: 70000
                    salary_visible: true
                    open_positions: 2
                    application_opening: null
                    application_deadline: '2026-12-01T12:30:00Z'
                    max_applications: 50
                    status: published
                    last_autosaved_at: null
                    published_at: '2026-11-01T12:30:00.123456789Z'
                    archived_at: null
                    created_at: '2026-10-31T12:30:00Z'
                    updated_at: '2026-11-01T12:30:00Z'
                    deleted_at: null
                    application_url: /v1/jobs/4ce85a22-78c1-48bb-bbf6-1b2e06f6ad17/apply
                next_cursor: '2026-11-01T12:30:00.123456789Z|4ce85a22-78c1-48bb-bbf6-1b2e06f6ad17'
        '400':
          description: Invalid query; codes are invalid_limit, invalid_salary_min, invalid_salary_max, or invalid_feed_query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingErrorResponse'
        '401':
          description: Missing, empty, expired, or invalid session; code is authentication_required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingErrorResponse'
        '403':
          description: The authenticated account is not a candidate; code is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingErrorResponse'
        '500':
          description: Authentication or feed dependency failure; code is authentication_unavailable or feed_unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingErrorResponse'

  /v1/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID of the job posting
        schema:
          type: string
          format: uuid
    get:
      summary: Get a company-owned job posting
      operationId: getCompanyJobPosting
      tags: [Jobs]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Job posting details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPosting'
        '400':
          $ref: '#/components/responses/PostingError'
        '401':
          $ref: '#/components/responses/PostingError'
        '403':
          $ref: '#/components/responses/PostingError'
        '404':
          $ref: '#/components/responses/PostingError'
        '500':
          $ref: '#/components/responses/PostingError'
    put:
      summary: Replace a job posting's details
      description: Replaces all editable fields; omitted nullable fields are cleared.
      operationId: updateCompanyJobPosting
      tags: [Jobs]
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPostingRequest'
      responses:
        '200':
          description: Updated job posting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPosting'
        '400':
          $ref: '#/components/responses/PostingError'
        '401':
          $ref: '#/components/responses/PostingError'
        '403':
          $ref: '#/components/responses/PostingError'
        '404':
          $ref: '#/components/responses/PostingError'
        '500':
          $ref: '#/components/responses/PostingError'
    delete:
      summary: Soft-delete a company-owned posting; system admins may delete any posting
      operationId: deleteCompanyJobPosting
      tags: [Jobs]
      security:
        - SessionCookie: []
      responses:
        '204':
          description: Posting marked as deleted; no response body
        '400':
          $ref: '#/components/responses/PostingError'
        '401':
          $ref: '#/components/responses/PostingError'
        '403':
          $ref: '#/components/responses/PostingError'
        '404':
          $ref: '#/components/responses/PostingError'
        '500':
          $ref: '#/components/responses/PostingError'

  /v1/jobs/{id}/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Preview a saved company posting
      operationId: previewSavedJobPosting
      tags: [Jobs]
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Candidate-facing posting content for feed and detail previews. Hidden salary values are null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPostingPreview'
        '400':
