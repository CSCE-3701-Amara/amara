components:

  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: amara_session


  parameters:
    JobPostingId:
      name: id
      in: path
      required: true
      description: UUID of the job posting
      schema:
        type: string
        format: uuid

    AccountId:
      name: accountId
      in: path
      required: true
      description: UUID of the account.
      schema:
        type: string
        format: uuid

    AccountType:
      name: accountType
      in: path
      required: true
      description: Account table discriminator.
      schema:
        type: string
        enum:
          - candidate
          - interviewer
          - company

    ApplicationId:
      name: applicationId
      in: path
      required: true
      description: UUID of the application.
      schema:
        type: string
        format: uuid

    AttemptId:
      name: attemptId
      in: path
      required: true
      description: UUID of the attempt.
      schema:
        type: string
        format: uuid

    CompanyId:
      name: companyId
      in: path
      required: true
      description: UUID of the company.
      schema:
        type: string
        format: uuid

    ExecutionId:
      name: executionId
      in: path
      required: true
      description: UUID of the execution.
      schema:
        type: string
        format: uuid

    InstanceId:
      name: instanceId
      in: path
      required: true
      description: UUID of the instance.
      schema:
        type: string
        format: uuid

    InterviewId:
      name: interviewId
      in: path
      required: true
      description: UUID of the interview.
      schema:
        type: string
        format: uuid

    InterviewerId:
      name: interviewerId
      in: path
      required: true
      description: UUID of the interviewer.
      schema:
        type: string
        format: uuid

    Limit:
      name: limit
      in: query
      required: false
      description: Maximum records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    ModuleId:
      name: moduleId
      in: path
      required: true
      description: UUID of the module.
      schema:
        type: string
        format: uuid

    OfferId:
      name: offerId
      in: path
      required: true
      description: UUID of the offer.
      schema:
        type: string
        format: uuid

    Offset:
      name: offset
      in: query
      required: false
      description: Number of records to skip.
      schema:
        type: integer
        minimum: 0
        default: 0

    PipelineId:
      name: pipelineId
      in: path
      required: true
      description: UUID of the pipeline.
      schema:
        type: string
        format: uuid

    QuestionId:
      name: questionId
      in: path
      required: true
      description: UUID of the question.
      schema:
        type: string
        format: uuid

    RequestId:
      name: requestId
      in: path
      required: true
      description: UUID of the request.
      schema:
        type: string
        format: uuid

    ResultId:
      name: resultId
      in: path
      required: true
      description: UUID of the result.
      schema:
        type: string
        format: uuid

    StageExecutionId:
      name: stageExecutionId
      in: path
      required: true
      description: UUID of the stage execution.
      schema:
        type: string
        format: uuid

    StageId:
      name: stageId
      in: path
      required: true
      description: UUID of the stage.
      schema:
        type: string
        format: uuid

    SubmissionId:
      name: submissionId
      in: path
      required: true
      description: UUID of the submission.
      schema:
        type: string
        format: uuid

    TransitionId:
      name: transitionId
      in: path
      required: true
      description: UUID of the transition.
      schema:
        type: string
        format: uuid

    VersionId:
      name: versionId
      in: path
      required: true
      description: UUID of the version.
      schema:
        type: string
        format: uuid


  headers:
    SessionCookie:
      description: HttpOnly session cookie established by the server.
      schema:
        type: string

    ClearedSessionCookie:
      description: Expired session cookie clearing the authenticated session.
      schema:
        type: string


  responses:
    BadRequest:
      description: Bad Request (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Unauthorized:
      description: Unauthorized (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Forbidden:
      description: Forbidden (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    NotFound:
      description: Not Found (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    MethodNotAllowed:
      description: Method Not Allowed (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Conflict:
      description: Conflict (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ContentTooLarge:
      description: Uploaded content exceeds the documented size limit (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    UnsupportedMediaType:
      description: Unsupported request or uploaded document media type (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    UnprocessableContent:
      description: Unprocessable Content (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    TooManyRequests:
      description: Too Many Requests (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    RateLimited:
      description: Rate limit exceeded (RFC 9457).
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: string
            pattern: ^[0-9]+$
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    InternalServerError:
      description: Internal Server Error (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ServiceUnavailable:
      description: Service Unavailable (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    PostingError:
      description: Posting management error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PostingErrorResponse'

  schemas:
    LinearPipelineDraft:
      type: object
      required: [id, postingId, versionId, versionNumber]
      properties:
        id: {type: string, format: uuid}
        postingId: {type: string, format: uuid}
        versionId: {type: string, format: uuid}
        versionNumber: {type: integer, minimum: 1}
    LinearDraftStage:
      type: object
      required: [name, type, scheduledStartAt, scheduledEndAt]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        name: {type: string}
        type:
          type: string
          enum: [assessment, live_interview]
        scheduledStartAt: {type: string, format: date-time}
        scheduledEndAt:
          type: string
          format: date-time
          description: Must be later than the opening time.
        moduleIds:
          description: Required for an assessment stage. Each module must belong to the company.
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, format: uuid}
        interview:
          description: Required for a live interview stage, which has no test modules.
          type: object
          required: [durationMinutes, interviewerIds, threshold, rubric, amarat]
          properties:
            durationMinutes: {type: integer, minimum: 1}
            interviewerIds:
              type: array
              minItems: 1
              uniqueItems: true
              items: {type: string, format: uuid}
            threshold: {type: integer, minimum: 0, maximum: 100}
            rubric:
              type: array
              minItems: 1
              items:
                type: object
                required: [description, amara]
                properties:
                  description: {type: string}
                  amara: {type: string}
            amarat:
              type: array
              minItems: 1
              items:
                type: object
                required: [name, crest, domain, description]
                properties:
                  name: {type: string}
                  crest: {type: string}
                  domain: {type: string}
                  description: {type: string}
    ModuleAuthoringSummary:
      type: object
      required: [id, name, description, type, published]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        type:
          type: string
          enum: [coding, programming_language, behavioral, recorded_video]
        published: {type: boolean}
    ModuleAuthoringInput:
      type: object
      required: [name, type]
      properties:
        name: {type: string}
        description: {type: string}
        type:
          type: string
          enum: [coding, programming_language, behavioral, recorded_video]
        active_minutes:
          type: integer
          minimum: 1
          description: Optional active timer for non-video modules.
        threshold:
          type: integer
          minimum: 0
          maximum: 100
          description: Required at publication for scored modules. Behavioral modules are unscored.
        questions:
          type: array
          items:
            type: object
            required: [prompt, format]
            properties:
              prompt: {type: string}
              format:
                type: string
                enum: [multiple_choice, short_text, long_text, code, video]
              options:
                type: array
                items: {type: string}
              amara: {type: string}
              difficulty: {type: string}
              test_cases:
                type: array
                items:
                  type: object
                  required: [input, expected_output, weight]
                  properties:
                    input: {type: string}
                    expected_output: {type: string}
                    weight: {type: integer, minimum: 1}
        amarat:
          type: array
          items:
            type: object
            required: [name, crest, domain, description]
            properties:
              name: {type: string}
              crest: {type: string}
              domain: {type: string}
              description: {type: string}
        rubric:
          type: array
          items:
            type: object
            required: [description, amara]
            properties:
              description: {type: string}
              amara: {type: string}
        library:
          type: object
          required: [amara]
          description: Choose specific published problems or a random difficulty mix.
          properties:
            amara: {type: string}
            problems:
              type: array
              items:
                $ref: '#/components/schemas/ModuleProblemReference'
            difficulty_mix:
              type: object
              additionalProperties: {type: integer, minimum: 1}
            pool:
              type: array
