    # Feedback
    FeedbackWrite:
      type: object
      additionalProperties: false
      properties:
        feedback:
          type: string
          minLength: 1
      required:
        - feedback
      description: Human-authored feedback. Server controls provenance, approval and release timestamps; changing
        feedback invalidates earlier approval.

    FeedbackView:
      type: object
      additionalProperties: false
      properties:
        feedback:
          type:
            - string
            - 'null'
        feedbackIsAiGenerated:
          type: boolean
        approvedAt:
          type:
            - string
            - 'null'
          format: date-time
        releasedAt:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - feedbackIsAiGenerated


    # Offers
    Offer:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        jobTitle:
          type: string
        compensationSummary:
          type: string
        proposedStartDate:
          type: string
          format: date
        responseDeadline:
          type: string
          format: date-time
        message:
          type:
            - string
            - 'null'
        status:
          type: string
          enum:
            - pending
            - accepted
            - declined
            - expired
            - withdrawn
        response:
          type:
            - string
            - 'null'
          enum:
            - accepted
            - declined
            - null
        respondedAt:
          type:
            - string
            - 'null'
          format: date-time
        withdrawnAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - id
        - applicationId
        - jobTitle
        - compensationSummary
        - proposedStartDate
        - responseDeadline
        - status
        - createdAt

    OfferPage:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Offer'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - data
        - pagination

    OfferCreateRequest:
      type: object
      additionalProperties: false
      properties:
        compensationSummary:
          type: string
          minLength: 1
        proposedStartDate:
          type: string
          format: date
        responseDeadline:
          type: string
          format: date-time
        message:
          type:
            - string
            - 'null'
        confirmCapacityExceeded:
          type: boolean
          default: false
      required:
        - compensationSummary
        - proposedStartDate
        - responseDeadline
      description: Job title is copied from the posting by the server. Deadline must be later than creation time.
        Explicit confirmation is required if pending plus accepted offers, including this offer, exceed open positions.

    OfferResponseRequest:
      type: object
      additionalProperties: false
      properties:
        response:
          type: string
          enum:
            - accepted
            - declined
      required:
        - response

    OfferDeadlineExtensionRequest:
      type: object
      additionalProperties: false
      properties:
        responseDeadline:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
      required:
        - responseDeadline
        - reason


    # System administration
    CompanyRegistrationReview:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        companyName:
          type: string
        registrationNumber:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum:
            - pending_review
            - approved
            - rejected
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type:
            - string
            - 'null'
          format: date-time
        reviewReason:
          type:
            - string
            - 'null'
      required:
        - id
        - companyName
        - registrationNumber
        - email
        - status
        - createdAt
      description: Administrator-only request projection; submitted password hashes and salts are excluded.

    CompanyRegistrationDecision:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum:
            - approve
            - reject
        reason:
          type: string
          minLength: 1
      required:
        - decision
        - reason

    CompanyRegistrationPage:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompanyRegistrationReview'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - data
        - pagination

    ManagedAccount:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        accountType:
          type: string
          enum:
            - candidate
            - interviewer
            - company
        name:
          type: string
        email:
          type: string
          format: email
        accountStatus:
          type:
            - string
            - 'null'
        companyId:
          type:
            - string
            - 'null'
          format: uuid
        approved:
          type:
            - boolean
            - 'null'
        banned:
          type:
            - boolean
            - 'null'
        banReason:
          type:
            - string
            - 'null'
        deactivatedAt:
          type:
            - string
            - 'null'
          format: date-time
        deletedAt:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - id
        - accountType
        - name
        - email
      description: Administrator-only account projection. Company legal name maps to name; fields not applicable
