          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/offers/{offerId}/response:
    parameters:
      - $ref: '#/components/parameters/OfferId'
    post:
      summary: Accept or decline a pending offer
      operationId: respondToOffer
      tags:
        - Offers
      description: Authenticated candidate only; records must belong to that candidate. Derive identity from
        the session. Require a pending offer and server time strictly before responseDeadline. Atomically record
        response/time and synchronize application status. At or after the deadline, expire the offer and reject
        with 409. Repeating the same recorded response returns the existing offer; an opposite response conflicts.
        Notifications do not undo the response.
      x-implementation-status: planned
      x-erd-entities:
        - OFFERS
        - APPLICATIONS
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferResponseRequest'
            example:
              response: accepted
      responses:
        '200':
          description: Accept or decline a pending offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/offers/{offerId}/deadline-extensions:
    parameters:
      - $ref: '#/components/parameters/OfferId'
    post:
      summary: Extend a pending offer response deadline
      operationId: extendOfferDeadline
      tags:
        - Offers
      description: Owning-company Hiring Manager or authorized system administrator only; validate ownership
        through the resource relationship chain. The current deadline must not have passed, offer must remain
        pending and new deadline must be later. Record old/new deadlines, actor, timestamp and reason in deadline
        history; notify the candidate. Reject races with expiry or response using 409.
      x-implementation-status: planned
      x-erd-entities:
        - OFFERS
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferDeadlineExtensionRequest'
            example:
              responseDeadline: '2026-11-23T10:00:00Z'
              reason: Candidate requested time to review the terms.
      responses:
        '200':
          description: Extend a pending offer response deadline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/offers/{offerId}/withdrawal:
    parameters:
      - $ref: '#/components/parameters/OfferId'
    post:
      summary: Withdraw an unexpired pending offer
      operationId: withdrawPendingOffer
      tags:
        - Offers
      description: Owning-company Hiring Manager or authorized system administrator only; validate ownership
        through the resource relationship chain. Require a pending offer before its deadline. Atomically record
        withdrawn status/time and return application status to Finalist, then notify the candidate. An already
        accepted/declined/expired offer cannot be withdrawn. Repeating an already completed withdrawal returns
        its existing state without duplicate notices.
      x-implementation-status: planned
      x-erd-entities:
        - OFFERS
        - APPLICATIONS
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Withdraw an unexpired pending offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'


