          type: string
          format: uuid
        interviewerId:
          type: string
          format: uuid
        assignedAt:
          type: string
          format: date-time
        scorecardStatus:
          type: string
          enum:
            - pending
            - submitted
            - waived
        waivedBy:
          type:
            - string
            - 'null'
          format: uuid
        waivedAt:
          type:
            - string
            - 'null'
          format: date-time
        waiverReason:
          type:
            - string
            - 'null'
      required:
        - interviewId
        - interviewerId
        - assignedAt
        - scorecardStatus

    InterviewAssignmentWrite:
      type: object
      additionalProperties: false
      properties:
        interviewerIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          uniqueItems: true
      required:
        - interviewerIds
      description: Full assigned-interviewer set. Every interviewer must be active and associated with the owning
        company; reject removal of submitted scorecards or changes incompatible with a confirmed meeting.

    InterviewAvailabilityWrite:
      type: object
      additionalProperties: false
      properties:
        slots:
          type: array
          items:
            $ref: '#/components/schemas/TimeSlot'
      required:
