      description: Replace the authenticated assigned interviewer's availability; empty array clears it. Slots
        must fall within stage scheduling constraints.

    InterviewScheduleRequest:
      type: object
      additionalProperties: false
      properties:
        slot:
          $ref: '#/components/schemas/TimeSlot'
      required:
        - slot

    InterviewOutcomeRequest:
      type: object
      additionalProperties: false
      properties:
        outcome:
          type: string
          enum:
            - held
            - candidate_absent
            - interviewer_absent
      required:
        - outcome

    InterviewFeedbackWrite:
      type: object
      additionalProperties: false
      properties:
        notes:
          type:
            - string
            - 'null'
        ratings:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 5
        recommendation:
          type:
            - string
            - 'null'
      required:
        - notes
        - ratings
        - recommendation
      description: Full draft scorecard replacement. Null clears optional notes/recommendation; every rating key
        must match a criterion in the interview rubric snapshot. Complete ratings and a written recommendation
        are required for submission.

    InterviewFeedback:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        interviewId:
          type: string
          format: uuid
        interviewerId:
          type: string
          format: uuid
        notes:
          type:
            - string
            - 'null'
        notesUpdatedAt:
          type:
            - string
            - 'null'
          format: date-time
        ratings:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 5
        recommendation:
          type:
            - string
            - 'null'
        submittedAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - id
        - interviewId
        - interviewerId
        - ratings
        - createdAt
