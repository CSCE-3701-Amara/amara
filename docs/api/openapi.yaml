            type: string
            format: uuid
      responses:
        '200':
          description: List offers visible to the current actor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/applications/{applicationId}/offers:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      summary: List offer history for an application
      operationId: listApplicationOffers
      tags:
        - Offers
      description: Only the owning candidate or owning company Hiring Manager may read this history. Preserve
        accepted, declined, expired and withdrawn rows.
      x-implementation-status: planned
      x-erd-entities:
        - OFFERS
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List offer history for an application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create an offer for a finalist
      operationId: createFinalistOffer
      tags:
        - Offers
      description: Owning-company Hiring Manager or authorized system administrator only; validate ownership
        through the resource relationship chain. Require Finalist status and no other pending offer for this
        application. Lock/check posting capacity; count pending and accepted offers. Return 409 with code offer_capacity_exceeded
        unless explicit confirmation is supplied; record capacity confirmation if it is. If capacity is unavailable
        return 503. Atomically create the pending offer and set application status. Notifications never roll
        back a recorded offer.
      x-implementation-status: planned
      x-erd-entities:
        - OFFERS
        - APPLICATIONS
        - JOB_POSTINGS
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferCreateRequest'
            example:
              compensationSummary: EGP 30000 per month
              proposedStartDate: '2026-12-01'
              responseDeadline: '2026-11-20T10:00:00Z'
              confirmCapacityExceeded: false
      responses:
        '201':
          description: Create an offer for a finalist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
          headers:
            Location:
              description: URI under /v1/offers/{offerId}.
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/offers/{offerId}:
    parameters:
      - $ref: '#/components/parameters/OfferId'
    get:
      summary: Get an authorized offer
      operationId: getOffer
      tags:
        - Offers
      description: Only the owning candidate or owning company Hiring Manager may read the offer.
      x-implementation-status: planned
      x-erd-entities:
        - OFFERS
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Get an authorized offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
