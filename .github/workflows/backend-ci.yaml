name: backend-ci

on:
  pull_request:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yaml"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Run unit tests
        run: go test -cover ./...

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Static security check with gosec
        run: gosec ./...
  
  style:
    name: Style
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
      
      - name: Check Formatting
        run: test -z $(go fmt ./...) 
      
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
