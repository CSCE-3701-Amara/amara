name: Release-Specific Checks

on:
  release:
    types: [published]

jobs:
  active-dast:
    name: ZAP Active Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ZAP full scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: ${{ secrets.STAGING_URL }}
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-release-report