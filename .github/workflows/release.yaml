name: Release-Specific Checks

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  active-dast:
    name: ZAP Active Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run ZAP full scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: ${{ secrets.STAGING_URL }}
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-release-report

      - name: Check public origin headers
        env:
          PUBLIC_ORIGIN: ${{ variables.PUBLIC_ORIGIN }}
        run: bash scripts/check-security-headers.sh