# Amara runtime orchestration for local and preview environments.
#
# Per docs/sdd/03-system-architecture.md the backend is one container image
# with two execution roles: the API process and the worker process. The web
# client is an OCI container served to the browser. Persistent state stays in
# the managed Supabase PostgreSQL instance and provider-integrated object
# storage, so no database or queue containers are declared here.
name: amara

# Infisical injects these values from the backend folder:
# `infisical run --env=dev --path=/backend -- docker compose up`. Config
# without Infisical comes from the shell (Compose reads a local .env file
# automatically); it must hold non-secret settings only.
x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HTTP_ADDR: ":8080"
  DATABASE_URL: ${DATABASE_URL:?database credentials are required, run under infisical run --path=/backend or set DATABASE_URL}
  DB_POOL_MAX_CONNS: ${DB_POOL_MAX_CONNS:-4}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
  HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
  HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-30s}
  HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
  HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-10s}
  HTTP_TRUSTED_PROXIES: ${HTTP_TRUSTED_PROXIES:-}

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  image: amara-backend:dev
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp

services:
  api:
    <<: *backend
    ports:
      - "${API_PORT:-8080}:8080"
    environment: *backend-env

  worker:
    <<: *backend
    command: ["/worker"]
    environment: *backend-env
    # The worker is a stub that exits until its queue work is implemented;
    # enable unless-stopped alongside the queue consumer work.
    restart: "no"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: amara-web:dev
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

# Interpolation happens in the x-backend-env block above; additional
# secret-backed integrations add their variables there when they arrive.
