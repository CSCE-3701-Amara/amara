# Amara runtime orchestration for local and preview environments.
#
# Per docs/sdd/03-system-architecture.md the backend is one container image
# with two execution roles: the API process and the worker process. The web
# client is an OCI container served to the browser. Judge0's database and Redis
# are local demo services; Amara's persistent state remains in Supabase.
name: amara

# Infisical injects these values from the backend folder:
# `infisical run --env=dev --path=/backend -- docker compose up`. Config
# without Infisical comes from the shell (Compose reads a local .env file
# automatically); it must hold non-secret settings only.
x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HTTP_ADDR: ":8080"
  DATABASE_URL: ${DATABASE_URL:?database credentials are required, run under infisical run --path=/backend or set DATABASE_URL}
  AUTH_AUTO_APPROVE_COMPANIES: ${AUTH_AUTO_APPROVE_COMPANIES:-false}
  AUTH_MFA_ENCRYPTION_KEY: ${AUTH_MFA_ENCRYPTION_KEY:?MFA encryption key is required, set a 32-byte secret}
  SMTP_HOST: ${SMTP_HOST:?SMTP host is required}
  SMTP_PORT: ${SMTP_PORT:?SMTP port is required}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:?SMTP sender address is required}
  JUDGE0_URL: ${JUDGE0_URL:-http://127.0.0.1:2358}
  JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
  JUDGE0_LANGUAGE_IDS: ${JUDGE0_LANGUAGE_IDS:-}
  JUDGE0_ALLOW_LOCAL_HTTP: ${JUDGE0_ALLOW_LOCAL_HTTP:-true}
  DB_POOL_MAX_CONNS: ${DB_POOL_MAX_CONNS:-4}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
  HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
  HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-30s}
  HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
  HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-10s}
  HTTP_TRUSTED_PROXIES: ${HTTP_TRUSTED_PROXIES:-}

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  image: amara-backend:dev
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp

services:
  api:
    <<: *backend
    ports:
      - "${API_PORT:-8080}:8080"
    environment: *backend-env

  worker:
    <<: *backend
    command: ["/worker"]
    environment:
      <<: *backend-env

  api-judge0-proxy:
    image: alpine/socat:1.8.0.3
    network_mode: service:api
    depends_on: [api, judge0]
    command: ["TCP-LISTEN:2358,bind=127.0.0.1,fork,reuseaddr", "TCP:judge0:2358"]
    restart: unless-stopped

  worker-judge0-proxy:
    image: alpine/socat:1.8.0.3
    network_mode: service:worker
    depends_on: [worker, judge0]
    command: ["TCP-LISTEN:2358,bind=127.0.0.1,fork,reuseaddr", "TCP:judge0:2358"]
    restart: unless-stopped

  judge0:
    container_name: amara-local-judge0-server
    image: mrkushalsm/judge0@sha256:d60605ad448453ac3754629bc7121d379cf691e0c091aabbc03ff2886b2626b2
    privileged: true
    volumes:
      - ./deployments/judge0/judge0.demo.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    depends_on: [judge0-db, judge0-redis]
    restart: unless-stopped

  judge0-worker:
    container_name: amara-local-judge0-worker
    image: mrkushalsm/judge0@sha256:d60605ad448453ac3754629bc7121d379cf691e0c091aabbc03ff2886b2626b2
    privileged: true
    command: ["./scripts/workers"]
    volumes:
      - ./deployments/judge0/judge0.demo.conf:/judge0.conf:ro
    depends_on: [judge0-db, judge0-redis]
    restart: unless-stopped

  judge0-db:
    container_name: amara-local-judge0-db
    image: postgres:16-alpine
    env_file: ./deployments/judge0/judge0.demo.conf
    networks:
      default:
        aliases: [db]
    volumes:
      - judge0-data:/var/lib/postgresql/data
    restart: unless-stopped

  judge0-redis:
    container_name: amara-local-judge0-redis
    image: redis:7-alpine
    env_file: ./deployments/judge0/judge0.demo.conf
    networks:
      default:
        aliases: [redis]
    command: ["sh", "-c", 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: amara-web:dev
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

# Interpolation happens in the x-backend-env block above; additional
# secret-backed integrations add their variables there when they arrive.
volumes:
  judge0-data:
    name: amara-judge0-local_data
